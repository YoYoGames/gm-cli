name: Package

on: [workflow_dispatch]

# TODO: What concurrency policy should we use?
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # You can pin a particular version by replacing latest. E.g., @experimental/gm@1.0.2
  GM_COMMAND: "@experimental/gm@latest"
  # TODO: Remove when not needed
  GAMEMAKER_PREFABS: ".prefabs"
  # TODO: Remove when not needed
  GAMEMAKER_AUTH_TOKEN: ${{ secrets.GAMEMAKER_AUTH_TOKEN }}

jobs:
  compile:
    strategy:
      matrix:
        include:
          # TODO: Should this be a matrix or a job input?
          - runner: ubuntu-latest
            target: operagx
          # - runner: ubuntu-latest
          #   target: linux
          # - runner: ubuntu-latest
          #   target: windows
          # - runner: macos-latest
          #   target: mac
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: ./test

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache
        uses: actions/cache@v5
        with:
          # TODO: Remove test/ for the real thing
          path: test/.gmcache
          key: ${{ runner.os }}-gmcache-${{ matrix.target }}

      - name: (TODO Remove) Make prefabs dir
        run: |
          echo "GAMEMAKER_PREFABS=$(pwd)/.prefabs" >> $GITHUB_ENV
          mkdir .prefabs

      # TODO: Add condition when it's optional
      - run: npx "$GM_COMMAND" login "$GAMEMAKER_PAT"
        env:
          GAMEMAKER_PAT: ${{ secrets.GAMEMAKER_PAT }}

      - run: npx "$GM_COMMAND" package --target ${{ matrix.target }} --output ./package.zip
        env:
          NO_COLOR: 1

      - uses: actions/upload-artifact@v7
        with:
          name: Bundle
          path: package.zip
